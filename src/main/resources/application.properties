spring.application.name=Eureka-Back
spring.datasource.url=jdbc:postgresql://localhost:5432/EurekaDB
spring.datasource.username=postgres
spring.datasource.password=13072001
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true  

# JWT Configuration
app.jwtSecret=eurekaSecretKey123456789012345678901234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
app.jwtExpirationMs=86400000

# CORS Configuration
#spring.web.cors.allowed-origins=http://localhost:4200
#spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.example.eurekaback.Security=DEBUG
logging.level.org.example.eurekaback.Controller=DEBUG
logging.level.org.example.eurekaback=DEBUG
#spring.web.cors.allowed-headers=*
#spring.web.cors.allow-credentials=true

# Jackson Configuration for Hibernate
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

